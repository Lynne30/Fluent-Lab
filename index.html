<title>Fluent Lab — studio d'anglais parlé</title>
<style>
  :root{
    --paper:#F4EEE2; --paper-2:#EAE2D0; --card:#FBF7EE; --card-2:#F1E9D9;
    --ink:#241E18; --ink-soft:#7A6E5F; --line:#DBCFB9;
    --accent:#E4552A; --accent-press:#C8431E; --accent-soft:#F7DCcf;
    --teal:#1C8A73; --teal-soft:#D3EBE2;
    --gold:#D99A20; --danger:#BE3A25; --danger-soft:#F3D9D2;
    --sans: system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --mono: ui-monospace,"SF Mono","Cascadia Mono","Segoe UI Mono",Consolas,monospace;
    --shadow: 0 1px 0 rgba(0,0,0,.04), 0 10px 28px -18px rgba(36,30,24,.5);
    --radius:14px;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --paper:#171310; --paper-2:#211A14; --card:#1F1811; --card-2:#26201A;
      --ink:#F1E7D6; --ink-soft:#A2937F; --line:#362B21;
      --accent:#F2673D; --accent-press:#D9502A; --accent-soft:#3a241a;
      --teal:#2DAE90; --teal-soft:#16332b;
      --gold:#E5AE3E; --danger:#E06450; --danger-soft:#3a221c;
      --shadow: 0 1px 0 rgba(0,0,0,.3), 0 14px 34px -20px rgba(0,0,0,.8);
    }
  }
  :root[data-theme="light"]{
    --paper:#F4EEE2; --paper-2:#EAE2D0; --card:#FBF7EE; --card-2:#F1E9D9;
    --ink:#241E18; --ink-soft:#7A6E5F; --line:#DBCFB9;
    --accent:#E4552A; --accent-press:#C8431E; --accent-soft:#F7DCcf;
    --teal:#1C8A73; --teal-soft:#D3EBE2; --gold:#D99A20;
    --danger:#BE3A25; --danger-soft:#F3D9D2;
    --shadow: 0 1px 0 rgba(0,0,0,.04), 0 10px 28px -18px rgba(36,30,24,.5);
  }
  :root[data-theme="dark"]{
    --paper:#171310; --paper-2:#211A14; --card:#1F1811; --card-2:#26201A;
    --ink:#F1E7D6; --ink-soft:#A2937F; --line:#362B21;
    --accent:#F2673D; --accent-press:#D9502A; --accent-soft:#3a241a;
    --teal:#2DAE90; --teal-soft:#16332b; --gold:#E5AE3E;
    --danger:#E06450; --danger-soft:#3a221c;
    --shadow: 0 1px 0 rgba(0,0,0,.3), 0 14px 34px -20px rgba(0,0,0,.8);
  }

  *{box-sizing:border-box}
  body{
    margin:0; background:var(--paper); color:var(--ink);
    font-family:var(--sans); line-height:1.55; -webkit-font-smoothing:antialiased;
    background-image:radial-gradient(circle at 12% -10%, color-mix(in srgb, var(--accent) 8%, transparent), transparent 40%);
  }
  button{font-family:inherit}
  ::selection{background:var(--accent); color:#fff}
  h1,h2,h3{text-wrap:balance; margin:0}
  .mono{font-family:var(--mono); font-variant-numeric:tabular-nums}
  .eyebrow{font-size:.7rem; letter-spacing:.16em; text-transform:uppercase; color:var(--ink-soft); font-weight:700; font-family:var(--mono)}

  /* ---------- Top bar ---------- */
  header.top{
    position:sticky; top:0; z-index:50; background:color-mix(in srgb,var(--paper) 86%, transparent);
    backdrop-filter:blur(10px); border-bottom:1px solid var(--line);
  }
  .top-inner{max-width:1020px; margin:0 auto; padding:12px 18px; display:flex; align-items:center; gap:14px}
  .brand{display:flex; align-items:center; gap:11px; margin-right:auto}
  .rec-dot{width:13px; height:13px; border-radius:50%; background:var(--accent);
    box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 22%, transparent); animation:pulse 2.4s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
  @media (prefers-reduced-motion:reduce){.rec-dot{animation:none}}
  .brand b{font-size:1.12rem; letter-spacing:-.02em}
  .brand span{font-family:var(--mono); font-size:.62rem; letter-spacing:.22em; color:var(--ink-soft); display:block; margin-top:-2px}
  .streak{display:flex; align-items:center; gap:6px; font-family:var(--mono); font-weight:700; font-size:.85rem;
    background:var(--card); border:1px solid var(--line); padding:6px 11px; border-radius:999px}
  .prof-btn{display:flex; align-items:center; gap:8px; border:1px solid var(--line); background:var(--card); color:var(--ink);
    border-radius:999px; padding:4px 13px 4px 5px; cursor:pointer; font-weight:600; font-size:.85rem; max-width:180px}
  .prof-btn:hover{border-color:var(--accent)}
  .prof-btn #profAvatar{width:27px; height:27px; border-radius:50%; display:grid; place-items:center;
    background:var(--pcolor,var(--accent)); font-size:.95rem; flex:0 0 auto}
  .prof-btn #profName{overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .modal-overlay{position:fixed; inset:0; background:rgba(0,0,0,.45); display:grid; place-items:center; z-index:200; padding:20px; animation:fade .2s ease both}
  .modal-overlay.gate{background:rgba(12,9,6,.74); backdrop-filter:blur(4px)}
  .modal{background:var(--card); border:1px solid var(--line); border-radius:16px; box-shadow:var(--shadow); width:min(440px,100%); max-height:85vh; overflow:auto; padding:22px}
  .prof-list{display:flex; flex-direction:column; gap:8px}
  .prof-row{display:flex; align-items:center; gap:10px; border:1px solid var(--line); border-radius:12px; padding:10px; background:var(--card-2)}
  .prof-row.active{border-color:var(--accent)}
  .prof-ava{width:40px; height:40px; border-radius:50%; border:none; cursor:pointer; font-size:1.2rem; color:#fff; flex:0 0 auto}
  .prof-ava:hover{filter:brightness(1.08)}
  .prof-name-input{width:100%; border:none; background:transparent; color:var(--ink); font-weight:650; font-size:.95rem; padding:2px 0; border-bottom:1px solid transparent}
  .prof-name-input:focus{outline:none; border-bottom-color:var(--accent)}
  .txt{flex:1; border:1px solid var(--line); background:var(--card-2); color:var(--ink); border-radius:10px; padding:9px 12px; font-size:.9rem; font-family:inherit}
  .txt:focus{outline:none; border-color:var(--accent)}
  @media(max-width:560px){ .prof-btn #profName{display:none} }
  .icon-btn{width:38px; height:38px; border-radius:10px; border:1px solid var(--line); background:var(--card);
    color:var(--ink); cursor:pointer; font-size:1rem; display:grid; place-items:center}
  .icon-btn:hover{border-color:var(--accent)}

  /* ---------- Nav ---------- */
  nav.tabs{max-width:1020px; margin:0 auto; padding:10px 18px 0; display:flex; gap:8px; overflow-x:auto; scrollbar-width:none}
  nav.tabs::-webkit-scrollbar{display:none}
  .tab{flex:0 0 auto; border:1px solid var(--line); background:var(--card); color:var(--ink-soft);
    padding:8px 15px; border-radius:999px; cursor:pointer; font-size:.86rem; font-weight:600; white-space:nowrap; display:flex; gap:7px; align-items:center}
  .tab:hover{color:var(--ink); border-color:var(--accent)}
  .tab[aria-selected="true"]{background:var(--ink); color:var(--paper); border-color:var(--ink)}
  .tab .ico{font-size:.95rem}

  main{max-width:1020px; margin:0 auto; padding:24px 18px 90px}
  .view{display:none; animation:fade .35s ease both}
  .view.active{display:block}
  @keyframes fade{from{opacity:0; transform:translateY(6px)}to{opacity:1; transform:none}}

  /* ---------- Cards & shared ---------- */
  .card{background:var(--card); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow)}
  .grid{display:grid; gap:16px}
  .btn{border:1px solid var(--ink); background:var(--ink); color:var(--paper); padding:10px 16px; border-radius:10px;
    font-weight:650; cursor:pointer; font-size:.9rem; transition:transform .08s}
  .btn:hover{transform:translateY(-1px)} .btn:active{transform:translateY(0)}
  .btn.ghost{background:transparent; color:var(--ink); border-color:var(--line)}
  .btn.ghost:hover{border-color:var(--accent)}
  .btn.accent{background:var(--accent); border-color:var(--accent); color:#fff}
  .btn.accent:hover{background:var(--accent-press)}
  .btn.small{padding:7px 12px; font-size:.82rem}
  .btn:disabled{opacity:.45; cursor:not-allowed; transform:none}
  .row{display:flex; gap:10px; flex-wrap:wrap; align-items:center}
  :focus-visible{outline:3px solid var(--accent); outline-offset:2px; border-radius:6px}

  .speak-btn{border:1px solid var(--teal); color:var(--teal); background:var(--teal-soft); border-radius:999px;
    padding:5px 12px; cursor:pointer; font-weight:650; font-size:.82rem; display:inline-flex; gap:6px; align-items:center}
  .speak-btn:hover{background:var(--teal); color:#fff}

  /* ---------- Dashboard ---------- */
  .hero{padding:26px 26px 24px; position:relative; overflow:hidden}
  .hero h1{font-size:clamp(1.7rem,4.5vw,2.5rem); letter-spacing:-.03em; line-height:1.05}
  .hero p.lead{color:var(--ink-soft); margin:10px 0 0; max-width:52ch}
  .stat-row{display:grid; grid-template-columns:repeat(auto-fit,minmax(120px,1fr)); gap:12px; margin-top:22px}
  .stat{background:var(--card-2); border:1px solid var(--line); border-radius:12px; padding:13px 15px}
  .stat .n{font-family:var(--mono); font-size:1.7rem; font-weight:700; line-height:1; letter-spacing:-.02em}
  .stat .l{font-size:.72rem; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.08em; margin-top:6px}
  .modules{display:grid; grid-template-columns:repeat(auto-fill,minmax(215px,1fr)); gap:14px; margin-top:18px}
  .mod{padding:18px; cursor:pointer; text-align:left; border:1px solid var(--line); background:var(--card); border-radius:var(--radius); transition:transform .1s, border-color .1s}
  .mod:hover{transform:translateY(-3px); border-color:var(--accent)}
  .mod .ic{font-size:1.5rem} .mod h3{font-size:1.05rem; margin:9px 0 4px; letter-spacing:-.01em}
  .mod p{margin:0; font-size:.83rem; color:var(--ink-soft)}
  .phrase{margin-top:16px; padding:18px 20px; border-left:4px solid var(--accent); background:var(--card-2); border-radius:0 12px 12px 0}
  .phrase .en{font-size:1.15rem; font-weight:650} .phrase .fr{color:var(--ink-soft); font-size:.9rem; margin-top:3px}

  .section-head{display:flex; align-items:end; justify-content:space-between; gap:12px; margin:4px 0 16px; flex-wrap:wrap}
  .section-head h2{font-size:1.5rem; letter-spacing:-.02em}
  .section-head p{margin:4px 0 0; color:var(--ink-soft); font-size:.9rem}

  .chips{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:16px}
  .chip{border:1px solid var(--line); background:var(--card); padding:7px 13px; border-radius:999px; cursor:pointer; font-size:.83rem; font-weight:600; color:var(--ink-soft)}
  .chip[aria-pressed="true"]{background:var(--accent-soft); border-color:var(--accent); color:var(--ink)}

  /* ---------- Flashcard ---------- */
  .flash-wrap{max-width:520px; margin:0 auto}
  .flash{perspective:1200px; height:290px; margin-bottom:16px}
  .flash-inner{position:relative; width:100%; height:100%; transition:transform .5s; transform-style:preserve-3d; cursor:pointer}
  .flash.flipped .flash-inner{transform:rotateY(180deg)}
  .face{position:absolute; inset:0; backface-visibility:hidden; border-radius:18px; border:1px solid var(--line);
    background:var(--card); box-shadow:var(--shadow); display:flex; flex-direction:column; align-items:center; justify-content:center; padding:26px; text-align:center}
  .face.back{transform:rotateY(180deg); background:var(--card-2)}
  .face .word{font-size:2rem; font-weight:700; letter-spacing:-.02em}
  .face .pos{font-family:var(--mono); font-size:.72rem; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.1em; margin-top:8px}
  .face .ex{margin-top:14px; color:var(--ink-soft); font-size:.9rem; font-style:italic; max-width:36ch}
  .face .hint{position:absolute; bottom:14px; font-size:.68rem; color:var(--ink-soft); font-family:var(--mono); letter-spacing:.1em; text-transform:uppercase}
  .progress{height:8px; background:var(--card-2); border:1px solid var(--line); border-radius:999px; overflow:hidden; margin-bottom:14px}
  .progress i{display:block; height:100%; background:var(--teal); transition:width .3s}

  /* ---------- Grammar ---------- */
  .lesson-list{display:grid; grid-template-columns:repeat(auto-fill,minmax(250px,1fr)); gap:14px}
  .lesson-card{padding:18px; cursor:pointer; text-align:left}
  .lesson-card:hover{border-color:var(--accent)}
  .lesson-card .num{font-family:var(--mono); font-size:.72rem; color:var(--accent); font-weight:700}
  .lesson-card h3{font-size:1.05rem; margin:6px 0 5px}
  .lesson-card p{margin:0; font-size:.83rem; color:var(--ink-soft)}
  .lesson-card .done{margin-top:10px; font-family:var(--mono); font-size:.72rem; color:var(--teal)}
  .lesson-detail{padding:24px}
  .lesson-detail h2{font-size:1.6rem; letter-spacing:-.02em; margin-bottom:6px}
  .lesson-detail .body{color:var(--ink); font-size:.97rem}
  .lesson-detail .body p{margin:12px 0}
  .egtable{width:100%; border-collapse:collapse; margin:14px 0; font-size:.92rem}
  .egtable td{border:1px solid var(--line); padding:9px 12px; vertical-align:top}
  .egtable td:first-child{font-weight:650; width:45%}
  .egtable .fr{color:var(--ink-soft); font-size:.85rem}
  .quiz-q{border-top:1px solid var(--line); padding-top:18px; margin-top:18px}
  .quiz-q .q{font-weight:650; margin-bottom:10px}
  .opt{display:block; width:100%; text-align:left; border:1px solid var(--line); background:var(--card); color:var(--ink);
    padding:11px 14px; border-radius:10px; margin-bottom:8px; cursor:pointer; font-size:.92rem}
  .opt:hover{border-color:var(--accent)}
  .opt.correct{background:var(--teal-soft); border-color:var(--teal); font-weight:650}
  .opt.wrong{background:var(--danger-soft); border-color:var(--danger)}
  .opt:disabled{cursor:default}
  .feedback{font-size:.88rem; margin-top:6px; padding:10px 12px; border-radius:8px; display:none}
  .feedback.show{display:block}
  .feedback.ok{background:var(--teal-soft); color:var(--ink)}
  .feedback.no{background:var(--danger-soft); color:var(--ink)}

  /* ---------- Games ---------- */
  .game-pick{display:grid; grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); gap:14px; margin-bottom:8px}
  .lvlgrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(56px,1fr)); gap:8px}
  .lvl-tile{aspect-ratio:1; border:1px solid var(--line); background:var(--card); border-radius:12px; font-family:var(--mono); font-weight:700; font-size:1.05rem; cursor:pointer; display:grid; place-items:center; color:var(--ink)}
  .lvl-tile:hover{border-color:var(--accent); transform:translateY(-2px)}
  .lvl-tile.locked{opacity:.4; cursor:not-allowed; background:var(--card-2)}
  .lvl-tile.locked:hover{transform:none; border-color:var(--line)}
  .lvl-tile.done{background:var(--teal-soft); border-color:var(--teal); color:var(--teal)}
  .lvl-tile small{font-size:.58rem; margin-left:1px}
  .match-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px; max-width:560px}
  .match-item{border:1px solid var(--line); background:var(--card); border-radius:10px; padding:13px; cursor:pointer; font-weight:600; text-align:center; font-size:.95rem}
  .match-item:hover{border-color:var(--accent)}
  .match-item.sel{background:var(--accent-soft); border-color:var(--accent)}
  .match-item.done{background:var(--teal-soft); border-color:var(--teal); color:var(--ink-soft); cursor:default; opacity:.65}
  .match-item.err{background:var(--danger-soft); border-color:var(--danger)}
  .builder-target{min-height:64px; border:2px dashed var(--line); border-radius:12px; padding:12px; display:flex; gap:8px; flex-wrap:wrap; margin-bottom:14px; background:var(--card-2)}
  .word-chip{border:1px solid var(--line); background:var(--card); padding:8px 13px; border-radius:9px; cursor:pointer; font-weight:600; font-size:.92rem}
  .word-chip:hover{border-color:var(--accent)}
  .bank{display:flex; gap:8px; flex-wrap:wrap}
  .qt-word{font-size:2rem; font-weight:700; text-align:center; margin:8px 0 18px; letter-spacing:-.02em}
  .qt-opts{display:grid; grid-template-columns:1fr 1fr; gap:10px}
  .timerbar{height:6px; background:var(--card-2); border-radius:999px; overflow:hidden; margin-bottom:16px; border:1px solid var(--line)}
  .timerbar i{display:block; height:100%; background:var(--accent); transition:width 1s linear}

  /* ---------- Dialogue ---------- */
  .chat{display:flex; flex-direction:column; gap:12px; margin-bottom:18px}
  .bubble{max-width:80%; padding:12px 15px; border-radius:15px; font-size:.95rem; position:relative}
  .bubble.them{background:var(--card-2); border:1px solid var(--line); border-bottom-left-radius:4px; align-self:flex-start}
  .bubble.you{background:var(--accent-soft); border:1px solid var(--accent); border-bottom-right-radius:4px; align-self:flex-end}
  .bubble .who{font-family:var(--mono); font-size:.64rem; text-transform:uppercase; letter-spacing:.1em; color:var(--ink-soft); margin-bottom:3px}
  .bubble .fr{color:var(--ink-soft); font-size:.82rem; margin-top:5px; display:none}
  .bubble.reveal .fr{display:block}

  /* ---------- Speaking ---------- */
  .mic-stage{text-align:center; padding:26px}
  .target-sentence{font-size:1.5rem; font-weight:650; letter-spacing:-.01em; margin:8px auto 8px; max-width:24ch}
  .mic-btn{width:96px; height:96px; border-radius:50%; border:none; background:var(--accent); color:#fff; font-size:2.1rem;
    cursor:pointer; margin:14px auto; display:grid; place-items:center; box-shadow:0 8px 24px -8px var(--accent)}
  .mic-btn:hover{background:var(--accent-press)}
  .mic-btn.rec{animation:ring 1.2s infinite}
  @keyframes ring{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--accent) 55%,transparent)}100%{box-shadow:0 0 0 26px transparent}}
  @media (prefers-reduced-motion:reduce){.mic-btn.rec{animation:none}}
  .score-ring{font-family:var(--mono); font-size:3rem; font-weight:700; letter-spacing:-.03em}
  .heard{font-style:italic; color:var(--ink-soft); margin-top:6px}
  .word-diff span{padding:1px 3px; border-radius:4px}
  .word-diff .hit{background:var(--teal-soft)} .word-diff .miss{background:var(--danger-soft); text-decoration:line-through}
  .notice{font-size:.82rem; color:var(--ink-soft); background:var(--card-2); border:1px solid var(--line); border-radius:10px; padding:11px 14px; margin-top:14px}

  .toast{position:fixed; bottom:20px; left:50%; transform:translateX(-50%) translateY(20px); background:var(--ink); color:var(--paper);
    padding:11px 18px; border-radius:999px; font-weight:600; font-size:.88rem; opacity:0; pointer-events:none; transition:.3s; z-index:100}
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0)}
  /* ---------- Progress: calendar, charts, plan ---------- */
  .cal{display:grid; grid-template-columns:repeat(7,1fr); gap:6px}
  .cal .dow{font-family:var(--mono); font-size:.6rem; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-soft); text-align:center; padding-bottom:2px}
  .cal .cell{aspect-ratio:1; border:1px solid var(--line); border-radius:9px; background:var(--card-2); display:grid; place-items:center;
    font-family:var(--mono); font-size:.72rem; color:var(--ink-soft); cursor:pointer}
  .cal .cell.empty{border:none; background:transparent; cursor:default}
  .cal .cell.done{background:var(--accent); color:#fff; border-color:var(--accent); font-weight:700}
  .cal .cell.today{outline:2px solid var(--teal); outline-offset:1px; color:var(--ink)}
  .cal .cell.today.done{color:#fff}
  .cal .cell.future{opacity:.35; cursor:not-allowed}
  .cal .cell:not(.empty):not(.future):hover{border-color:var(--accent)}
  .barc{display:flex; align-items:flex-end; gap:6px; height:130px; padding-top:8px}
  .barc .bar{flex:1; display:flex; flex-direction:column; justify-content:flex-end; align-items:center; gap:5px; height:100%}
  .barc .bar i{width:100%; max-width:26px; background:var(--accent); border-radius:5px 5px 0 0; min-height:3px; transition:height .4s}
  .barc .bar.goal i{background:var(--teal)}
  .barc .bar small{font-family:var(--mono); font-size:.56rem; color:var(--ink-soft)}
  .mbar{display:flex; flex-direction:column; gap:13px}
  .mbar .r{display:grid; grid-template-columns:110px 1fr 44px; align-items:center; gap:10px}
  .mbar .r .track{height:10px; background:var(--card-2); border:1px solid var(--line); border-radius:999px; overflow:hidden}
  .mbar .r .track i{display:block; height:100%; border-radius:999px; transition:width .4s}
  .mbar .r .pctv{font-family:var(--mono); font-weight:700; font-size:.85rem; text-align:right}
  .rec-card{display:flex; gap:14px; align-items:flex-start; padding:16px; border:1px solid var(--line); border-radius:12px; background:var(--card)}
  .rec-card .rico{font-size:1.3rem; line-height:1.2}
  /* segmented level control */
  .seg{display:inline-flex; background:var(--card-2); border:1px solid var(--line); border-radius:999px; padding:3px; gap:2px}
  .seg-btn{border:none; background:transparent; color:var(--ink-soft); padding:6px 13px; border-radius:999px; cursor:pointer; font-size:.8rem; font-weight:600; white-space:nowrap}
  .seg-btn .mono{font-size:.6rem; opacity:.65}
  .seg-btn:hover{color:var(--ink)}
  .seg-btn[aria-pressed="true"]{background:var(--accent); color:#fff}
  .seg-btn[aria-pressed="true"] .mono{opacity:.85}
  @media(max-width:560px){ .match-grid{grid-template-columns:1fr} .qt-opts{grid-template-columns:1fr} .hero{padding:20px}
    .mbar .r{grid-template-columns:92px 1fr 40px} }
</style>

    {q:"The dog wags ___ tail.",opts:["it's","its","his","her"],a:1,why:"possessif de it → its (sans apostrophe)."}
  ]},
  { key:"genitive", level:"A2", title:"Génitif « 's »", rule:"Possession : nom + 's (Anna's car). Pluriel en -s → apostrophe seule (the girls' room).", items:[
    {q:"This is ___ bag.",opts:["Anna's","Annas","Anna","of Anna"],a:0,why:"possession → Anna's."},

  ]},
  { key:"objpron", level:"A2", title:"Pronoms compléments", rule:"me, you, him, her, it, us, them (après le verbe ou la préposition).", items:[
    {q:"I saw ___ at the party. (Tom)",opts:["he","him","his","he's"],a:1,why:"complément → him."},
    {q:"Can you help ___? (moi)",opts:["I","me","my","mine"],a:1,why:"complément → me."},
    {q:"We invited ___ to dinner. (eux)",opts:["they","them","their","theirs"],a:1,why:"complément → them."}

  { key:"freq", level:"A2", title:"Adverbes de fréquence", rule:"always, usually, often, sometimes, never : devant le verbe, mais après « be ».", items:[
    {q:"She ___ drinks coffee in the morning.",opts:["always","is always","drinks always","always is"],a:0,why:"avant le verbe → always drinks."},
    {q:"I am ___ late for work.",opts:["never am","never","am never late","late never"],a:1,why:"après be → am never."},
    {q:"They ___ go to the gym.",opts:["sometimes","are sometimes","sometimes are","go sometimes"],a:0,why:"avant le verbe → sometimes go."}
  ]},
  { key:"whq", level:"A2", title:"Questions Wh-", rule:"What (quoi), Where (où), When (quand), Who (qui), Why (pourquoi), How (comment).", items:[
    {q:"___ do you live?",opts:["What","Where","Who","When"],a:1,why:"lieu → Where."},
    {q:"___ is your birthday?",opts:["Where","Who","When","What"],a:2,why:"temps → When."},

  ]},
  { key:"imperative", level:"A2", title:"Impératif", rule:"Ordre/conseil : base verbale (Open the door). Négatif : Don't + base.", items:[

  { key:"someany", level:"A2", title:"some / any (basique)", rule:"some (affirmatif), any (négatif / question).", items:[

  { key:"likeing", level:"A2", title:"like + -ing (goûts)", rule:"like / love / enjoy / hate + verbe-ing.", items:[
    {q:"I love ___ football.",opts:["play","to playing","playing","plays"],a:2,why:"love + -ing → playing."},
    {q:"She enjoys ___ books.",opts:["read","reading","to read","reads"],a:1,why:"enjoy + -ing → reading."},
    {q:"They hate ___ early.",opts:["get up","getting up","to getting up","gets up"],a:1,why:"hate + -ing → getting up."}

  /* ===================== B1 (compléments) ===================== */
  { key:"perfectforsince", level:"B1", title:"Present perfect : for / since", rule:"for + durée (for 5 years). since + point de départ (since 2010).", items:[

  ]},
  { key:"pastcont", level:"B1", title:"Past continuous", rule:"was/were + -ing = action en cours dans le passé (souvent interrompue).", items:[
    {q:"I ___ TV when he called.",opts:["watched","was watching","am watching","watch"],a:1,why:"action en cours → was watching."},
    {q:"They ___ dinner at 8 p.m.",opts:["were having","was having","have","having"],a:0,why:"they → were having."},
    {q:"While she ___, it started to rain.",opts:["walked","was walking","walks","is walking"],a:1,why:"arrière-plan → was walking."}

  { key:"usedto", level:"B1", title:"used to (habitude passée)", rule:"used to + base = habitude passée révolue. Négatif : didn't use to.", items:[
    {q:"I ___ smoke, but I stopped.",opts:["use to","used to","am used to","used"],a:1,why:"habitude passée → used to."},
    {q:"She ___ like coffee when she was young.",opts:["didn't used to","didn't use to","doesn't use to","not used to"],a:1,why:"négatif → didn't use to."},
    {q:"___ you use to play tennis?",opts:["Did","Do","Were","Have"],a:0,why:"question → Did you use to…?"}
  ]},
  { key:"asas", level:"B1", title:"as … as (égalité)", rule:"as + adjectif + as = égalité. not as … as = infériorité.", items:[
    {q:"He is ___ tall ___ his father.",opts:["so / as","as / as","as / than","more / as"],a:1,why:"égalité → as … as."},
    {q:"This film isn't ___ good ___ the first one.",opts:["as / as","so / than","as / than","more / as"],a:0,why:"not as … as."},
    {q:"She runs ___ fast ___ me.",opts:["as / than","so / as","as / as","more / than"],a:2,why:"égalité → as fast as."}
  ]},
  { key:"tooenough", level:"B1", title:"too / enough", rule:"too + adjectif (trop). adjectif + enough (assez). enough + nom.", items:[
    {q:"This coffee is ___ hot to drink.",opts:["enough","too","very much","so much"],a:1,why:"trop → too hot."},
    {q:"He isn't old ___ to drive.",opts:["too","enough","very","so"],a:1,why:"assez → old enough."},
    {q:"We don't have ___ time.",opts:["enough","too","too much","many"],a:0,why:"enough + nom → enough time."}
  ]},
  { key:"haveto", level:"B1", title:"have to / don't have to", rule:"have to = obligation. don't have to = pas nécessaire.", items:[
    {q:"You ___ wear a uniform at this school.",opts:["have to","have","must to","are to"],a:0,why:"obligation → have to."},
    {q:"She ___ work on Sundays. (pas nécessaire)",opts:["mustn't","doesn't have to","don't have to","hasn't to"],a:1,why:"pas nécessaire → doesn't have to."},
    {q:"___ we bring our passports?",opts:["Do we have to","Have we to","Must to","Are we have to"],a:0,why:"question → Do we have to…?"}
  ]},
  { key:"willmight", level:"B1", title:"will / might (probabilité)", rule:"will = quasi-certain. might = possible (peut-être).", items:[
    {q:"Take an umbrella, it ___ rain later.",opts:["will definitely","might","must","won't"],a:1,why:"possibilité → might."},
    {q:"I'm sure she ___ pass the exam.",opts:["might","will","might not","may not"],a:1,why:"certitude → will."},
    {q:"I'm not sure, I ___ come to the party.",opts:["will","won't","might","must"],a:2,why:"incertitude → might."}
  ]},
  { key:"cond1", level:"B1", title:"First conditional", rule:"If + présent, will + base (situation réelle future).", items:[
    {q:"If it rains, we ___ at home.",opts:["stay","will stay","stayed","would stay"],a:1,why:"type 1 → will stay."},
    {q:"If you ___ hard, you'll pass.",opts:["will study","study","studied","studies"],a:1,why:"if + présent → study."},
    {q:"She'll be angry if you ___ late.",opts:["will be","are","were","be"],a:1,why:"if + présent → are."}
  ]},
  { key:"gerinf", level:"B1", title:"Gérondif vs infinitif", rule:"want/need/decide + to + base. enjoy/finish/avoid + -ing.", items:[
    {q:"I want ___ a doctor.",opts:["seeing","to see","see","saw"],a:1,why:"want + to → to see."},
    {q:"She finished ___ her homework.",opts:["to do","doing","do","does"],a:1,why:"finish + -ing → doing."},
    {q:"They decided ___ early.",opts:["leaving","to leave","leave","left"],a:1,why:"decide + to → to leave."}
  ]},
  { key:"tags", level:"B1", title:"Question tags", rule:"Phrase affirmative → tag négatif (…, isn't it?). Phrase négative → tag positif.", items:[
    {q:"You're French, ___?",opts:["isn't it","aren't you","are you","don't you"],a:1,why:"You're → aren't you."},
    {q:"She can swim, ___?",opts:["can't she","can she","doesn't she","isn't she"],a:0,why:"can → can't she."},
    {q:"They don't live here, ___?",opts:["don't they","do they","aren't they","are they"],a:1,why:"négatif → do they."}
  ]},
  { key:"passive", level:"B1", title:"Passif (présent / passé)", rule:"be + participe passé. The house was built in 1990.", items:[
    {q:"English ___ all over the world.",opts:["speaks","is spoken","is speaking","speak"],a:1,why:"passif présent → is spoken."},
    {q:"The bridge ___ last year.",opts:["was built","built","is built","builds"],a:0,why:"passif passé → was built."},
    {q:"These cars ___ in Japan.",opts:["make","are made","is made","made"],a:1,why:"pluriel passif → are made."}
  ]},
  { key:"sosuch", level:"B1", title:"so / such", rule:"so + adjectif/adverbe. such + (a/an) + (adj) + nom.", items:[
    {q:"It was ___ a good film.",opts:["so","such","very","too"],a:1,why:"such + a + nom → such a good film."},
    {q:"She is ___ kind.",opts:["such","so","such a","a so"],a:1,why:"so + adjectif → so kind."},
    {q:"They have ___ nice children.",opts:["so","such","such a","a such"],a:1,why:"such + nom pluriel → such nice children."}
  ]},
  { key:"advmanner", level:"B1", title:"Adverbes de manière", rule:"adjectif + -ly (quick → quickly). Irréguliers : good → well, fast → fast.", items:[
    {q:"He speaks English very ___.",opts:["good","well","goodly","best"],a:1,why:"adverbe de good → well."},
    {q:"She drives too ___.",opts:["fastly","fast","quick","speedy"],a:1,why:"fast est déjà adverbe → fast."},
    {q:"Please listen ___.",opts:["careful","carefully","carefuly","care"],a:1,why:"careful → carefully."}
  ]},
  { key:"prepverb", level:"B1", title:"Verbe + préposition", rule:"Prépositions fixes : depend on, listen to, wait for, look at.", items:[
    {q:"It depends ___ the weather.",opts:["of","on","to","from"],a:1,why:"depend on."},
    {q:"I'm waiting ___ the bus.",opts:["for","to","at","on"],a:0,why:"wait for."},
    {q:"Listen ___ me!",opts:["at","to","for","on"],a:1,why:"listen to."}
  ]},
  { key:"quantB1", level:"B1", title:"a few / a little", rule:"a few + dénombrable pluriel. a little + indénombrable.", items:[
    {q:"I have ___ friends in London.",opts:["a little","a few","much","little"],a:1,why:"dénombrable → a few."},
    {q:"Add ___ salt to the soup.",opts:["a few","a little","many","few"],a:1,why:"indénombrable → a little."},
    {q:"There are ___ apples left.",opts:["a little","a few","much","little"],a:1,why:"dénombrable → a few."}
  ]},

  /* ===================== B2 (compléments) ===================== */
  { key:"cond2", level:"B2", title:"Second conditional", rule:"If + prétérit, would + base (hypothèse irréelle du présent).", items:[
    {q:"If I ___ rich, I would travel.",opts:["am","was","were","will be"],a:2,why:"2e conditionnel → If I were."},
    {q:"She would help if she ___ time.",opts:["has","had","have","would have"],a:1,why:"if + prétérit → had."},

    {q:"If I had known, I ___ you.",opts:["would tell","would have told","told","will tell"],a:1,why:"3e conditionnel → would have told."},

  ]},
  { key:"pastperf", level:"B2", title:"Past perfect", rule:"had + participe = action antérieure à une autre action passée.", items:[
    {q:"When we arrived, the film ___.",opts:["already started","had already started","starts","was starting"],a:1,why:"antériorité → had already started."},
    {q:"He told me he ___ the keys.",opts:["lost","had lost","has lost","loses"],a:1,why:"antérieur → had lost."},
    {q:"She ___ never eaten sushi before that day.",opts:["has","had","did","was"],a:1,why:"past perfect → had (never eaten)."}
  ]},
  { key:"perfectcont", level:"B2", title:"Present perfect continuous", rule:"have/has been + -ing = action commencée avant et qui continue.", items:[
    {q:"I ___ for two hours.",opts:["have been waiting","have waited","am waiting","wait"],a:0,why:"durée en cours → have been waiting."},
    {q:"She's tired because she ___ all day.",opts:["has worked","has been working","works","is working"],a:1,why:"activité prolongée → has been working."},
    {q:"How long ___ you ___ English?",opts:["have / learnt","have / been learning","did / learn","are / learning"],a:1,why:"durée continue → have you been learning."}
  ]},
  { key:"reported", level:"B2", title:"Discours indirect", rule:"Le présent recule au passé : « I am tired » → He said he was tired.", items:[
    {q:"« I am busy. » → She said she ___ busy.",opts:["is","was","were","has been"],a:1,why:"présent → passé : was."},
    {q:"« I will call you. » → He said he ___ call me.",opts:["will","would","will to","would to"],a:1,why:"will → would."},
    {q:"« I saw them. » → She said she ___ them.",opts:["saw","had seen","has seen","sees"],a:1,why:"prétérit → had seen."}
  ]},
  { key:"passiveadv", level:"B2", title:"Passif (temps composés)", rule:"has been done, is being done, will be done.", items:[
    {q:"The report ___ (déjà terminé).",opts:["has been finished","has finished","is finish","was finish"],a:0,why:"present perfect passif → has been finished."},
    {q:"The road ___ right now.",opts:["is repaired","is being repaired","repairs","was repairing"],a:1,why:"présent continu passif → is being repaired."},

  ]},
  { key:"causative", level:"B2", title:"Causatif (have sth done)", rule:"have/get + objet + participe passé = faire faire qch par un tiers.", items:[
    {q:"I had my car ___ yesterday.",opts:["repaired","repair","repairing","to repair"],a:0,why:"have + objet + participe → had my car repaired."},
    {q:"She's going to have her hair ___ tomorrow.",opts:["cut","cutting","to cut","cuts"],a:0,why:"have + objet + participe → have her hair cut."},
    {q:"We need to get the windows ___.",opts:["cleaned","clean","cleaning","to clean"],a:0,why:"get + objet + participe → get the windows cleaned."}

  { key:"deduction", level:"B2", title:"Modaux de déduction", rule:"must be (certitude +), can't be (certitude −), might/could be (possibilité).", items:[

    {q:"She ___ be at work, I'm not sure.",opts:["must","might","can't","won't"],a:1,why:"possibilité → might."}
  ]},
  { key:"modalspast", level:"B2", title:"Modaux au passé", rule:"should have + participe (regret), must have (déduction), can't have (impossibilité).", items:[
    {q:"You ___ told me! I was worried.",opts:["should have","must have","can't have","would"],a:0,why:"reproche → should have told."},

    {q:"I wish it ___ raining!",opts:["stops","stopped","would stop","will stop"],a:2,why:"agacement → wish + would."}
  ]},
  { key:"relativeadv", level:"B2", title:"Relatives (whose / non-défini)", rule:"whose = dont (possession). Relatives non essentielles : virgules + which (pas that).", items:[
    {q:"That's the woman ___ car was stolen.",opts:["who","whose","which","that"],a:1,why:"possession → whose."},

    {q:"Paris, ___ is the capital of France, is beautiful.",opts:["that","which","who","whose"],a:1,why:"non-défini + chose → which."}

  { key:"gerinfadv", level:"B2", title:"Gérondif / infinitif (sens)", rule:"stop to do (s'arrêter pour) ≠ stop doing (arrêter de). remember to do ≠ remember doing.", items:[

    {q:"Remember ___ the door when you leave.",opts:["locking","to lock","lock","locked"],a:1,why:"tâche future → remember to lock."},
    {q:"I'll never forget ___ the Eiffel Tower for the first time.",opts:["to see","seeing","see","saw"],a:1,why:"souvenir → forget seeing."}
  ]},
  { key:"futureperf", level:"B2", title:"Futur antérieur / continu", rule:"will have + participe (terminé avant un moment futur). will be + -ing (en cours dans le futur).", items:[
    {q:"By 2030, I ___ my studies.",opts:["will finish","will have finished","finish","am finishing"],a:1,why:"terminé avant → will have finished."},
    {q:"This time tomorrow, I ___ on a beach.",opts:["will lie","will be lying","lie","have lain"],a:1,why:"en cours dans le futur → will be lying."},
    {q:"They ___ the project by Friday.",opts:["will have completed","will completing","complete","are completing"],a:0,why:"achèvement futur → will have completed."}
  ]},
  { key:"inversion", level:"B2", title:"Inversion", rule:"Adverbe négatif en tête (Never, Rarely, Not only…) → inversion sujet/auxiliaire.", items:[
    {q:"Never ___ such a beautiful sunset.",opts:["I have seen","have I seen","I saw","did I saw"],a:1,why:"inversion → have I seen."},
    {q:"Rarely ___ so happy.",opts:["she is","is she","she has","does she is"],a:1,why:"inversion → is she."},
    {q:"Not only ___ late, but he also forgot the tickets.",opts:["he was","was he","he is","did he was"],a:1,why:"inversion → was he."}
  ]},
  { key:"purpose", level:"B2", title:"Expression du but", rule:"to / in order to + base. so that + proposition.", items:[
    {q:"She left early ___ catch the train.",opts:["for","to","for to","that"],a:1,why:"but → to catch."},
    {q:"I wrote it down ___ I wouldn't forget.",opts:["to","for","so that","in order"],a:2,why:"but + proposition → so that."},
    {q:"He spoke slowly ___ everyone could understand.",opts:["to","so that","for","in order to"],a:1,why:"but + proposition → so that."}
  ]},
  { key:"contrast", level:"B2", title:"Contraste (although/despite)", rule:"although + proposition. despite / in spite of + nom ou -ing. however = cependant.", items:[
    {q:"___ it was raining, we went out.",opts:["Despite","Although","In spite","However"],a:1,why:"+ proposition → Although."},
    {q:"___ the rain, we went out.",opts:["Although","Despite","Even though","However"],a:1,why:"+ nom → Despite."},
    {q:"It was expensive. ___, we bought it.",opts:["Although","Despite","However","In spite of"],a:2,why:"relie deux phrases → However."}
  ]},
  { key:"quantadv", level:"B2", title:"Quantifieurs avancés", rule:"few/little (peu, négatif) ≠ a few/a little (un peu, positif). plenty of (beaucoup).", items:[
    {q:"He has ___ friends; he's quite lonely.",opts:["a few","few","a little","much"],a:1,why:"sens négatif → few."},
    {q:"Don't worry, we have ___ of time.",opts:["few","little","plenty","many"],a:2,why:"beaucoup → plenty of."},
    {q:"There's ___ hope of winning now.",opts:["a little","little","few","a few"],a:1,why:"sens négatif indénombrable → little."}
  ]},
  { key:"articlesadv", level:"B2", title:"Articles avancés", rule:"Ø : noms généraux, langues, la plupart des pays. the : océans/fleuves, chaînes (the Alps).", items:[
    {q:"She's learning ___ Japanese.",opts:["the","a","an","—"],a:3,why:"langue → pas d'article."},
    {q:"We sailed across ___ Atlantic.",opts:["—","the","a","an"],a:1,why:"océan → the Atlantic."},
    {q:"___ love is important.",opts:["The","A","—","An"],a:2,why:"nom abstrait général → pas d'article."}
  ]}
];

function normalizeState(s){
  const st=Object.assign({}, DEFAULT_STATE, s||{});
  st.gen=Object.assign({done:0,skill:{},history:[]}, st.gen||{});
  st.gen.skill=Object.assign({}, st.gen.skill);
  st.gen.history=(st.gen.history||[]).slice();
  st.featureUse=Object.assign({}, st.featureUse);
  st.appDaily=Object.assign({}, st.appDaily);
  st.sessions=st.sessions||0;
  st.gamesDone=Object.assign({}, st.gamesDone);
  st.gamesUnlocked=st.gamesUnlocked||1;
  st.vocabLevel=Object.assign({}, st.vocabLevel);
  return st;
}
function loadProfiles(){
  try{ const p=JSON.parse(localStorage.getItem(PKEY)); if(p&&p.list&&p.list.length) return p; }catch(e){}
  return null;
}
function saveProfiles(){ try{ localStorage.setItem(PKEY, JSON.stringify(profiles)); }catch(e){} }
function activeProfile(){ return profiles.list.find(p=>p.id===profiles.active)||profiles.list[0]; }
function loadStateFor(id){
  try{ const s=JSON.parse(localStorage.getItem(skey(id))); if(s) return normalizeState(s); }catch(e){}
  return normalizeState(null);
}

let profiles = loadProfiles();
if(!profiles){
  // Migration : bascule l'ancienne progression unique dans un premier profil.
  const id=uid();
  profiles={ list:[{id, name:"Moi", emoji:"🎧", color:PCOLORS[0]}], active:id };
  const old=localStorage.getItem("fluentlab");
  if(old){ try{ localStorage.setItem(skey(id), old); }catch(e){} }
  saveProfiles();
}
let state = loadStateFor(profiles.active);

function save(){ try{ localStorage.setItem(skey(profiles.active), JSON.stringify(state)); }catch(e){} }
function addXP(n){ state.xp += n; state.daysDone[todayKey()]=true; state.streak=computeStreak(); updateStreakBadge(); save(); }

/* ---- Gestion des profils ---- */
function switchProfile(id){
  if(id===profiles.active) return;
  save();
  profiles.active=id; saveProfiles();
  state=loadStateFor(id);
  state.lastVisit=new Date().toDateString(); state.streak=computeStreak(); save();
  updateStreakBadge(); renderProfileBadge();
  go("home");
  requireEmail();
}
function createProfile(name){
  const id=uid();
  const emoji=AVATARS[profiles.list.length % AVATARS.length];
  const color=PCOLORS[profiles.list.length % PCOLORS.length];
  profiles.list.push({id, name:name||"Nouveau profil", emoji, color});
  saveProfiles();
  switchProfile(id);
}
function renameProfile(id, name){ const p=profiles.list.find(x=>x.id===id); if(p&&name){ p.name=name; saveProfiles(); renderProfileBadge(); } }
function setProfileAvatar(id, emoji, color){ const p=profiles.list.find(x=>x.id===id); if(p){ if(emoji)p.emoji=emoji; if(color)p.color=color; saveProfiles(); renderProfileBadge(); } }
function deleteProfile(id){
  if(profiles.list.length<=1) return;
  try{ localStorage.removeItem(skey(id)); }catch(e){}
  profiles.list=profiles.list.filter(p=>p.id!==id);
  if(profiles.active===id){ profiles.active=profiles.list[0].id; state=loadStateFor(profiles.active); }
  saveProfiles(); save(); updateStreakBadge();
}

/* ---- Collecte des emails (Supabase) ---- */
function validEmail(e){ return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e); }
function saveEmail(id, email){
  const p=profiles.list.find(x=>x.id===id); if(!p) return false;
  email=(email||"").trim().toLowerCase();
  if(email && !validEmail(email)){ toast("Email invalide"); return false; }
  p.email=email; saveProfiles();
  if(email && p.emailSynced!==email) syncEmail(p);
  if(email) setTimeout(syncStats, 400);
  return true;
}
function backendReady(){ return !!SHEET_ENDPOINT || (!!SUPABASE_URL && !!SUPABASE_ANON_KEY); }
function markSynced(p){ p.emailSynced=p.email; saveProfiles(); }
function syncEmail(p){
  if(!p.email) return;
  const payload={ email:p.email, name:p.name, level:state.level };
  if(SHEET_ENDPOINT){
    // Corps texte simple => pas de prévol CORS ; Apps Script lit e.postData.contents.
    fetch(SHEET_ENDPOINT,{ method:"POST", body:JSON.stringify(payload) })
      .then(r=>r.json()).then(j=>{ if(j&&j.ok) markSynced(p); }).catch(()=>{});
    return;
  }
  if(SUPABASE_URL && SUPABASE_ANON_KEY){
    fetch(SUPABASE_URL.replace(/\/$/,"")+"/rest/v1/"+SUPABASE_TABLE+"?on_conflict=email",{
      method:"POST",
      headers:{ "apikey":SUPABASE_ANON_KEY, "Authorization":"Bearer "+SUPABASE_ANON_KEY, "Content-Type":"application/json", "Prefer":"return=minimal,resolution=ignore-duplicates" },
      body: JSON.stringify(payload)
    }).then(r=>{ if(r.ok) markSynced(p); }).catch(()=>{});
  }
}
function syncAllPending(){ if(!backendReady()) return; profiles.list.forEach(p=>{ if(p.email && p.emailSynced!==p.email) syncEmail(p); }); }

/* ---- Analytics : fonctionnalités utilisées + temps passé ---- */
const FEAT_LABEL={home:"Accueil",progress:"Progrès",path:"Parcours",vocab:"Vocabulaire",grammar:"Grammaire",games:"Jeux",dialogue:"Conversation",speak:"Prononciation",reading:"Lecture",shadow:"Shadowing",talk:"Élocution"};
function statsPayload(){
  const p=activeProfile();
  const ad=state.appDaily||{};
  const days=Object.keys(ad).length||1;
  const totalSec=Object.keys(ad).reduce((a,k)=>a+(ad[k]||0),0);
  const fu=state.featureUse||{};
  const feats=Object.keys(fu).sort((a,b)=>fu[b]-fu[a]).map(k=>(FEAT_LABEL[k]||k)+" ("+fu[k]+")").join(", ");
  return { type:"stats", email:(p&&p.email)||"", name:(p&&p.name)||"", level:state.level,
    features:feats, total_min:Math.round(totalSec/60), days:days,
    avg_day_min:Math.round(totalSec/60/days*10)/10, sessions:state.sessions||0,
    avg_session_min:state.sessions?Math.round(totalSec/60/state.sessions*10)/10:0,
    last_seen:new Date().toISOString() };
}
function syncStats(){ const p=activeProfile(); if(!p||!p.email||!SHEET_ENDPOINT) return; fetch(SHEET_ENDPOINT,{method:"POST",body:JSON.stringify(statsPayload())}).catch(()=>{}); }
function syncStatsBeacon(){ const p=activeProfile(); if(!p||!p.email||!SHEET_ENDPOINT) return; try{ navigator.sendBeacon(SHEET_ENDPOINT, JSON.stringify(statsPayload())); }catch(e){} }

function renderFeatBars(features){
  if(!features || !Object.keys(features).length) return `<div style="color:var(--ink-soft);font-size:.8rem">Pas encore de données.</div>`;
  const arr=Object.keys(features).map(k=>[k,features[k]]).sort((x,y)=>y[1]-x[1]).slice(0,8);
  const max=arr[0][1]||1;
  return arr.map(([k,v])=>`<div class="r"><span style="font-size:.8rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(k)}</span><div class="track"><i style="width:${Math.round(v/max*100)}%;background:var(--accent)"></i></div><span class="pctv">${v}</span></div>`).join("");
}
function renderSignupBars(signups){
  if(!signups || !signups.length) return `<div style="color:var(--ink-soft);font-size:.8rem">Pas encore de données.</div>`;
  const total=signups.reduce((a,s)=>a+(s.n||0),0);
  if(total===0) return `<div style="color:var(--ink-soft);font-size:.8rem">Les inscriptions par jour s'afficheront ici au fil des arrivées.</div>`;
  const max=Math.max(1, ...signups.map(s=>s.n||0));
  return `<div class="barc" style="height:90px">${signups.map(s=>`<div class="bar" title="${esc(String(s.d))} : ${s.n||0}"><i style="height:${Math.round((s.n||0)/max*100)}%"></i><small>${esc(String(s.d)).slice(0,2)}</small></div>`).join("")}</div>`;
}

/* ---- Adaptive level ---- */
function levelName(l){ return l==="A2"?"Débutant":l==="B2"?"Avancé":"Intermédiaire"; }
function levelRate(){ return state.level==="A2"?0.78:state.level==="B2"?1.0:0.9; }
function byLevel(list){ const f=list.filter(x=>x.level===state.level); return f.length?f:list; }
function activeReadings(){ return byLevel(READINGS); }
function activeShadow(){ return byLevel(SHADOW); }
function activeDeck(){ const all=VOCAB[vState.cat]||[]; const f=all.filter(w=>w.lvl===state.level); return f.length?f:all; }
function setLevel(l){ if(state.level===l) return; state.level=l; vState.idx=0; rdState.idx=0; shState.idx=0; save(); if(renderers[curView]) renderers[curView](); }
function levelPickerHTML(){
  const L=[["A2","Débutant"],["B1","Intermédiaire"],["B2","Avancé"]];
  return `<div class="seg" role="group" aria-label="Niveau">${L.map(x=>`<button class="seg-btn" data-lvl="${x[0]}" aria-pressed="${state.level===x[0]}">${x[1]} <span class="mono">${x[0]}</span></button>`).join("")}</div>`;
}
function suggestLevel(){
  const ra=readingAvg();
  const gl=levelSkills();
  const gm=gl.length?Math.round(gl.reduce((s,gb)=>s+(state.lessonsDone[gb.key]||0),0)/gl.length):0;
  const score = ra!=null ? Math.round(ra*0.7 + gm*0.3) : gm;
  if(score>=88) return "B2";
  if(score<62 && (ra!=null || gm>0)) return "A2";
  return "B1";
}

function computeStreak(){
  let s=0; const d=new Date();
  if(!state.daysDone[d.toDateString()]) d.setDate(d.getDate()-1);
  while(state.daysDone[d.toDateString()]){ s++; d.setDate(d.getDate()-1); }
  return s;
}
function markDay(ds, val){
  if(val) state.daysDone[ds]=true; else delete state.daysDone[ds];
  state.streak=computeStreak(); save();
}
function updateStreakBadge(){ const e=document.getElementById("streakN"); if(e) e.textContent=state.streak; }
(function initStreak(){
  // Migration : conserve une série existante en la reportant sur les jours marqués.
  if(Object.keys(state.daysDone).length===0 && state.streak>0 && state.lastVisit){
    let d=new Date(state.lastVisit);
    for(let i=0;i<state.streak;i++){ state.daysDone[d.toDateString()]=true; d.setDate(d.getDate()-1); }
  }
  state.lastVisit=new Date().toDateString();
  state.streak=computeStreak(); save();
})();

function speak(text, rate){
  if(!('speechSynthesis' in window)){ toast("La synthèse vocale n'est pas disponible sur ce navigateur."); return; }
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = "en-US"; u.rate = rate || levelRate();
  const v = voices.find(x=>/en[-_]?US/i.test(x.lang)) || voices.find(x=>/^en/i.test(x.lang));
  if(v) u.voice = v;
  speechSynthesis.speak(u);
}

/* single utterance recorder (shadowing, prononciation) */
function recordUtterance(target, cb){
  if(!SR_OK){ cb.onError && cb.onError("unsupported"); return; }
  let rec; try{ rec=new SR(); }catch(e){ cb.onError && cb.onError("fail"); return; }
  rec.lang="en-US"; rec.interimResults=false; rec.maxAlternatives=1; let got=false;
  cb.onStart && cb.onStart();
  rec.onresult=e=>{ got=true; const h=e.results[0][0].transcript; cb.onScore && cb.onScore(scoreSpeech(target,h),h); };
  rec.onerror=e=>{ cb.onError && cb.onError(e.error); };
  rec.onend=()=>{ cb.onEnd && cb.onEnd(got); };
  try{ rec.start(); }catch(e){ cb.onError && cb.onError("fail"); }
}

/* continuous session (reading, élocution) — auto-restarts while active */
function startContinuousSession(cb){
  const sess={active:true, transcript:"", rec:null, stop:function(){ this.active=false; if(this.rec){ try{this.rec.stop();}catch(e){} } }};
  if(!SR_OK){ return sess; }
  function build(){
    let rec; try{ rec=new SR(); }catch(e){ cb.onError && cb.onError("fail"); return null; }
    rec.lang="en-US"; rec.continuous=true; rec.interimResults=true;
    rec.onresult=e=>{ let add=""; for(let i=e.resultIndex;i<e.results.length;i++){ if(e.results[i].isFinal) add+=e.results[i][0].transcript+" "; } if(add){ sess.transcript+=add; cb.onUpdate && cb.onUpdate(sess.transcript); } };
    rec.onerror=e=>{ if(e.error==="not-allowed"||e.error==="service-not-allowed"){ sess.active=false; cb.onError && cb.onError(e.error); } };
    rec.onend=()=>{ if(sess.active){ try{ rec.start(); }catch(e){} } };
    return rec;
  }
  sess.rec=build(); if(sess.rec){ try{ sess.rec.start(); }catch(e){ cb.onError && cb.onError("fail"); } }
  return sess;
}

function readingScore(passage, heard){
  const pw=norm(passage).split(" ").filter(Boolean);
  const hset=new Set(norm(heard).split(" ").filter(Boolean));
  const seen=new Set(); const missed=[]; let hit=0;
  pw.forEach(w=>{ if(hset.has(w)) hit++; else if(!seen.has(w) && w.length>1){ missed.push(w); seen.add(w); } });
  return {pct: pw.length?Math.round(hit/pw.length*100):0, missed:missed.slice(0,30)};
}

/* normalise & compare */
function norm(s){ return s.toLowerCase().replace(/[^a-z0-9\s']/g,"").replace(/\s+/g," ").trim(); }
function scoreSpeech(target, heard){
  const t = norm(target).split(" "), h = new Set(norm(heard).split(" "));
  let hit=0; const marks = t.map(w=>{ const ok=h.has(w); if(ok)hit++; return {w,ok}; });
  return {pct: Math.round(hit/t.length*100), marks};
}

let vState={idx:0, flipped:false};
const VSIZE=6;
function seededShuffle(arr, seed){
  const a=arr.slice(); let s=(seed>>>0)||1;
  function rnd(){ s|=0; s=s+0x6D2B79F5|0; let t=Math.imul(s^s>>>15,1|s); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(rnd()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}
function vocabPool(){ const p=allWords().filter(w=>w.lvl===state.level); return p.length?p:allWords(); }
function getVLevel(){ return (state.vocabLevel && state.vocabLevel[state.level]) || 1; }
function setVLevel(n){ if(!state.vocabLevel) state.vocabLevel={}; state.vocabLevel[state.level]=Math.max(1,n); vState.idx=0; vState.flipped=false; save(); renderVocab(); }
function vocabDeck(){
  const P=vocabPool(); const n=getVLevel();
  const per=Math.min(VSIZE, P.length);
  const cycleLen=Math.max(1, Math.ceil(P.length/per));
  const cycle=Math.floor((n-1)/cycleLen);
  const posInCycle=(n-1)%cycleLen;
  const order=seededShuffle(P, cycle+7);
  const deck=[];
  for(let i=0;i<per;i++) deck.push(order[(posInCycle*per+i)%order.length]);
  return deck;
}
function vocabDeckDone(){ const d=vocabDeck(); return d.every(w=>state.known[w.en]); }
function renderVocab(){
  const v=$("#view-vocab");
  const n=getVLevel();
  const deck=vocabDeck();
  const knownInDeck=deck.filter(w=>state.known[w.en]).length;
  v.innerHTML=`
    <div class="section-head"><div><h2>Vocabulaire</h2><p>Des niveaux à l'infini : chaque niveau t'apporte un nouveau lot de mots à mémoriser.</p></div>${levelPickerHTML()}</div>
    <div class="flash-wrap">
      <div class="row" style="justify-content:space-between;align-items:center;margin-bottom:14px">
        <button class="btn ghost small" id="vLevPrev" ${n<=1?"disabled":""}>← Niv. ${n-1}</button>
        <div style="text-align:center"><div class="eyebrow">Niveau ${state.level} · ${knownInDeck}/${deck.length} connus</div><div class="mono" style="font-size:1.5rem;font-weight:700;line-height:1">${n} <span style="color:var(--ink-soft);font-size:.85rem">/ ∞</span></div></div>
        <button class="btn accent small" id="vLevNext">Niv. ${n+1} →</button>
      </div>
      <div class="progress"><i id="vprog"></i></div>
      <div class="flash" id="flash"><div class="flash-inner">
        <div class="face front" id="ffront"></div>
        <div class="face back" id="fback"></div>
      </div></div>
      <div class="row" style="justify-content:space-between">
        <button class="btn ghost small" id="vprev">← Précédent</button>
        <div class="row">
          <button class="btn ghost small" id="vreview">🔁 À revoir</button>
          <button class="btn accent small" id="vknow">✓ Je connais</button>
        </div>
        <button class="btn ghost small" id="vnext">Suivant →</button>
      </div>
    </div>`;
  $("#flash").addEventListener("click",e=>{ if(e.target.closest("[data-speak]"))return; vState.flipped=!vState.flipped; $("#flash").classList.toggle("flipped",vState.flipped); });
  $("#vLevPrev").onclick=()=>{ if(n>1) setVLevel(n-1); };
  $("#vLevNext").onclick=()=>setVLevel(n+1);
  $("#vprev").onclick=()=>moveCard(-1);
  $("#vnext").onclick=()=>moveCard(1);
  $("#vknow").onclick=()=>markCard(true);
  $("#vreview").onclick=()=>markCard(false);
  drawCard();
}
function moveCard(d){ const list=vocabDeck(); vState.idx=(vState.idx+d+list.length)%list.length; vState.flipped=false; $("#flash").classList.remove("flipped"); drawCard(); }
function markCard(known){
  const list=vocabDeck(), w=list[vState.idx];
  if(known){ if(!state.known[w.en]){ state.known[w.en]=1; addXP(2);} toast("Bien joué ! +2 XP"); }
  else { delete state.known[w.en]; toast("On la reverra 🔁"); }
  save();
  if(known && vState.idx>=list.length-1 && vocabDeckDone()){ toast("Niveau terminé ! 🎉"); setTimeout(()=>setVLevel(getVLevel()+1),500); return; }
  setTimeout(()=>moveCard(1),250);
}
function drawCard(){
  const list=vocabDeck(); if(vState.idx>=list.length) vState.idx=0; const w=list[vState.idx];
  $("#vprog").style.width=((vState.idx+1)/list.length*100)+"%";
  const badge = state.known[w.en]?' · <span style="color:var(--teal)">connu</span>':'';
  $("#ffront").innerHTML=`<div class="eyebrow">Niveau ${getVLevel()} · ${state.level}${badge}</div><div class="word">${esc(w.en)}</div><div class="pos">${esc(w.pos||"")}</div><div style="margin-top:16px">${spk(w.en)}</div><div class="hint">Clique pour retourner</div>`;
  $("#fback").innerHTML=`<div class="word" style="color:var(--accent)">${esc(w.fr)}</div>${w.ex?`<div class="ex">“${esc(w.ex)}”</div><div style="margin-top:14px">${spk(w.ex)}</div>`:""}<div class="hint">${vState.idx+1} / ${list.length}</div>`;
}

function startGameLevel(n){
  const stage=$("#gameStage");
  const pool=allWords().filter(w=>w.lvl===state.level); const P=pool.length?pool:allWords();

    <div id="qbody"></div></div>`;
  function next(){
    current=P[Math.floor(Math.random()*P.length)];
    const opts=shuffle([current, ...shuffle(P.filter(w=>w!==current)).slice(0,3)]);
    $("#qbody").innerHTML=`<div class="eyebrow" style="text-align:center">Traduis en anglais</div><div class="qt-word">${esc(current.fr)}</div>

      else b.classList.add("wrong");
      setTimeout(next,200);
    });

  function finish(win){
    clearInterval(timer); _run.timer=null;
    if(win){
      if(!state.gamesDone) state.gamesDone={};
      if(state.gamesDone[n]==null||state.gamesDone[n]<score) state.gamesDone[n]=score;
      if(n===(state.gamesUnlocked||1) && n<20) state.gamesUnlocked=n+1;

  next();

function allWords(){ return Object.values(VOCAB).flat(); }

/* --- Match --- */
function gameMatch(){
  const stage=$("#gameStage");
  const pairs=shuffle(allWords()).slice(0,6);
  const left=shuffle(pairs), right=shuffle(pairs);
  let sel=null, done=0;
  stage.innerHTML=`<div class="card" style="padding:20px">
    <div class="row" style="justify-content:space-between;margin-bottom:14px"><b>Associe les paires</b><span class="mono" id="mstat">0 / 6</span></div>
    <div class="match-grid">
      <div id="mLeft"></div><div id="mRight" style="display:flex;flex-direction:column;gap:10px"></div>
    </div></div>`;
  const L=el("div"); L.style.cssText="display:flex;flex-direction:column;gap:10px";
  left.forEach(w=>{ const i=el("div","match-item",esc(w.en)); i.dataset.en=w.en; i.dataset.side="en"; L.appendChild(i); });
  $("#mLeft").replaceWith(L);
  const R=$("#mRight");
  right.forEach(w=>{ const i=el("div","match-item",esc(w.fr)); i.dataset.en=w.en; i.dataset.side="fr"; R.appendChild(i); });
  stage.addEventListener("click",function h(e){
    const it=e.target.closest(".match-item"); if(!it||it.classList.contains("done"))return;
    if(!sel){ sel=it; it.classList.add("sel"); return; }
    if(sel===it){ it.classList.remove("sel"); sel=null; return; }
    if(sel.dataset.side===it.dataset.side){ sel.classList.remove("sel"); sel=it; it.classList.add("sel"); return; }
    if(sel.dataset.en===it.dataset.en){
      [sel,it].forEach(x=>{x.classList.remove("sel");x.classList.add("done");}); sel=null; done++;
      $("#mstat").textContent=done+" / 6"; addXP(2);
      if(done===6){ toast("Parfait ! Toutes les paires trouvées 🎉 +12 XP"); state.gamesPlayed++; save(); }
    } else {
      const a=sel,b=it; a.classList.add("err"); b.classList.add("err"); a.classList.remove("sel");
      setTimeout(()=>{a.classList.remove("err");b.classList.remove("err");},500); sel=null;
    }
  });
}

/* --- Sentence builder --- */
function gameBuild(){
  const stage=$("#gameStage");
  const sentence=SENTENCES[Math.floor(Math.random()*SENTENCES.length)];
  const words=sentence.split(" ");
  let placed=[];
  stage.innerHTML=`<div class="card" style="padding:20px">
    <div class="row" style="justify-content:space-between;margin-bottom:14px"><b>Remets la phrase dans l'ordre</b>${spk(sentence)}</div>
    <div class="builder-target" id="bt"></div>
    <div class="bank" id="bank"></div>
    <div class="row" style="margin-top:16px">
      <button class="btn accent small" id="bcheck">Vérifier</button>
      <button class="btn ghost small" id="breset">Recommencer</button>
      <button class="btn ghost small" id="bnew">Nouvelle phrase</button>
    </div>
    <div class="feedback" id="bfb"></div>
  </div>`;
  const bank=$("#bank"), target=$("#bt");
  function draw(){
    bank.innerHTML=""; target.innerHTML="";
    shuffle(words.map((w,i)=>({w,i}))).forEach(o=>{
      if(placed.includes(o.i))return;
      const c=el("button","word-chip",esc(o.w)); c.onclick=()=>{ placed.push(o.i); draw(); }; bank.appendChild(c);
    });
    placed.forEach((idx,pos)=>{
      const c=el("button","word-chip",esc(words[idx])); c.onclick=()=>{ placed.splice(pos,1); draw(); }; target.appendChild(c);
    });
    if(!placed.length) target.innerHTML='<span style="color:var(--ink-soft);font-size:.85rem">Clique les mots pour construire la phrase…</span>';
  }
  $("#bcheck").onclick=()=>{
    const fb=$("#bfb"); const attempt=placed.map(i=>words[i]).join(" ");
    if(attempt===sentence){ fb.className="feedback show ok"; fb.textContent="✓ Parfait ! “"+sentence+".” +8 XP"; addXP(8); state.gamesPlayed++; save(); speak(sentence); }
    else { fb.className="feedback show no"; fb.textContent="✗ Pas encore dans le bon ordre. Réessaie !"; }
  };
  $("#breset").onclick=()=>{ placed=[]; $("#bfb").className="feedback"; draw(); };
  $("#bnew").onclick=gameBuild;
  draw();
}

let dState={idx:0, shown:0};
function renderDialogue(){
  const v=$("#view-dialogue");
  v.innerHTML=`
    <div class="section-head"><div><h2>Conversation</h2><p>Choisis une scène, écoute chaque réplique et joue tes lignes à voix haute.</p></div></div>

function drawDialogue(){
  const d=DIALOGUES[dState.idx], stage=$("#dstage");

      <button class="btn ghost small" id="dplayall">🔊 Tout écouter</button>
    </div>`;
  const chat=$("#chat");

    const b=el("div","bubble "+(l.them?"them":"you"));
    b.innerHTML=`<div class="who">${esc(l.who)}</div><div>${esc(l.en)} ${spk(l.en)}${l.them?"":' <button class="speak-btn" data-practice="'+esc(l.en)+'">🎤 M\'entraîner</button>'}</div><div class="fr">${esc(l.fr)}</div>`;
    chat.appendChild(b);
  });
  if(dState.shown>=2 && d.lines[dState.shown-1].them) speak(d.lines[dState.shown-1].en);
  const more=$("#dmore"); if(more) more.onclick=()=>{ dState.shown++; drawDialogue(); };
  const rs=$("#drestart"); if(rs) rs.onclick=()=>{ dState.shown=2; drawDialogue(); };

  $("#dplayall").onclick=()=>playSequence(d.lines.slice(0,dState.shown));
  chat.querySelectorAll("[data-practice]").forEach(b=>b.onclick=()=>go("speak")||practiceLine(b.dataset.practice));
}
function playSequence(lines){
  if(!('speechSynthesis' in window)) return toast("Synthèse vocale indisponible.");
  speechSynthesis.cancel(); let i=0;
  (function nxt(){ if(i>=lines.length)return; const u=new SpeechSynthesisUtterance(lines[i].en); u.lang="en-US"; u.rate=0.92;
    const vo=voices.find(x=>/en[-_]?US/i.test(x.lang)); if(vo)u.voice=vo; u.onend=()=>{i++;nxt();}; speechSynthesis.speak(u); })();
}

function selfAssess(target){
  $("#result").innerHTML=`<div style="margin-top:16px" class="row" style="justify-content:center">
    <span style="color:var(--ink-soft);font-size:.88rem;margin-right:6px">Comment c'était ?</span>

    <button class="btn ghost small" id="saMid">😐 À revoir</button></div>`;
  $("#saOk").onclick=()=>{ addXP(3); toast("Super ! +3 XP"); };
  $("#saMid").onclick=()=>toast("On y retravaille 💪");

function startRec(target){
  const btn=$("#micBtn"), st=$("#micState"), res=$("#result");
  if(!SR_OK){ speak(target); selfAssess(target); return; }
  let rec;
  try{ rec=new SR(); }catch(e){ selfAssess(target); return; }
  rec.lang="en-US"; rec.interimResults=false; rec.maxAlternatives=1;
  btn.classList.add("rec"); st.textContent="🔴 Parle maintenant…"; res.innerHTML="";
  let got=false;
  rec.onresult=e=>{
    got=true; const heard=e.results[0][0].transcript;
    const {pct,marks}=scoreSpeech(target,heard);
    const color = pct>=80?"var(--teal)":pct>=50?"var(--gold)":"var(--danger)";
    const msg = pct>=80?"Excellent, très clair ! 🎯":pct>=50?"Pas mal, encore un effort 👍":"Réessaie doucement 🐢";
    res.innerHTML=`<div style="margin-top:16px">
      <div class="score-ring" style="color:${color}">${pct}%</div>
      <div class="eyebrow">correspondance</div>
      <div class="word-diff" style="margin-top:10px">${marks.map(m=>`<span class="${m.ok?'hit':'miss'}">${esc(m.w)}</span>`).join(" ")}</div>
      <div class="heard">tu as dit : “${esc(heard)}”</div>
      <p style="color:var(--ink-soft)">${msg}</p></div>`;
    if(pct>=50) addXP(Math.round(pct/20));
    if(pct>state.speakBest){ state.speakBest=pct; }
    save();
  };
  rec.onerror=ev=>{
    btn.classList.remove("rec"); st.textContent="Appuie pour enregistrer";
    if(ev.error==="not-allowed"||ev.error==="service-not-allowed"){
      res.innerHTML=`<div class="notice" style="border-color:var(--accent)"><b>🎤 Micro bloqué</b><div style="margin-top:6px">${micHelpBody()}</div></div>`;
      selfAssess(target);
    } else if(ev.error==="no-speech"){ st.textContent="Je n'ai rien entendu — réessaie"; }
  };
  rec.onend=()=>{ btn.classList.remove("rec"); if(!got && st.textContent.startsWith("🔴")) st.textContent="Appuie pour enregistrer"; };
  try{ rec.start(); }catch(e){ btn.classList.remove("rec"); selfAssess(target); }
}

  const line=p.lines[shState.line];
  v.innerHTML=`
    <div class="section-head"><div><h2>Shadowing</h2><p>Écoute le modèle et répète <b>immédiatement</b> en copiant le rythme et l'intonation. Un segment à la fois.</p></div>${levelPickerHTML()}</div>

  v.querySelectorAll("[data-sh]").forEach(b=>b.onclick=()=>{ shState.idx=+b.dataset.sh; shState.line=0; renderShadow(); });

  $("#shloop").onclick=()=>{ speak(line); setTimeout(()=>speak(line), Math.max(1600, line.length*95)); };
  $("#shprev").onclick=()=>{ shState.line=(shState.line-1+p.lines.length)%p.lines.length; renderShadow(); };
  $("#shnext").onclick=()=>{ shState.line=(shState.line+1)%p.lines.length; renderShadow(); };
  $("#shmic").onclick=()=>shadowRec(line);
}
function shadowRec(target){
  const btn=$("#shmic"), st=$("#shstate"), res=$("#shresult");
  if(!SR_OK){ speak(target); return; }
  recordUtterance(target,{
    onStart:()=>{ btn.classList.add("rec"); st.textContent="🔴 Parle…"; res.innerHTML=""; },
    onScore:(r,heard)=>{
      const color=r.pct>=80?"var(--teal)":r.pct>=50?"var(--gold)":"var(--danger)";
      res.innerHTML=`<div style="text-align:center;margin-top:12px"><span class="score-ring" style="color:${color}">${r.pct}%</span>
        <div class="word-diff" style="margin-top:8px">${r.marks.map(m=>`<span class="${m.ok?'hit':'miss'}">${esc(m.w)}</span>`).join(" ")}</div>
        <div class="heard">tu as dit : “${esc(heard)}”</div></div>`;
      if(r.pct>=60) addXP(2);
    },
    onError:(err)=>{ btn.classList.remove("rec"); st.textContent="Appuie pour répéter"; if(err==="not-allowed"||err==="service-not-allowed") res.innerHTML=`<div class="notice" style="border-color:var(--accent)"><b>🎤 Micro bloqué</b><div style="margin-top:6px">${micHelpBody()}</div></div>`; },
    onEnd:(got)=>{ btn.classList.remove("rec"); if(!got) st.textContent="Répète après le modèle"; }
  });
}

let tkState={topic:null, running:false, left:60, transcript:""};
function renderTalk(){
  const v=$("#view-talk");
  if(!tkState.topic) tkState.topic=TOPICS[Math.floor(Math.random()*TOPICS.length)];
  const t=tkState.topic;
  v.innerHTML=`

      <div class="eyebrow">Ton sujet</div>

      <div class="score-ring" id="tkClock" style="margin:18px 0 6px">01:00</div>
      <div class="timerbar" style="max-width:320px;margin:0 auto 16px"><i id="tkBar" style="width:100%"></i></div>
      <div class="row" style="justify-content:center">
        <button class="btn accent" id="tkBtn">● Commencer</button>
        <button class="btn ghost" id="tkNew">🎲 Autre sujet</button>
      </div>
      <div id="tkResult"></div>
    </div>
    <div class="card" style="padding:20px;margin-top:16px">
      <div class="eyebrow">Structure express (1 min)</div>
      <table class="egtable"><tbody>
        <tr><td>0–15 s · Intro</td><td class="fr">Reformule le sujet et donne ton avis général.</td></tr>
        <tr><td>15–45 s · Corps</td><td class="fr">Deux raisons, ou un exemple concret et personnel.</td></tr>
        <tr><td>45–60 s · Conclusion</td><td class="fr">Résume ton idée en une phrase.</td></tr>
      </tbody></table>
      <div class="eyebrow" style="margin-top:14px">Phrases pour gagner du temps</div>
      <div class="row" style="margin-top:8px">${["Well, let me think about that...","That's an interesting question.","There are a few reasons for this.","For example,...","On the other hand,...","To sum up,..."].map(p=>`<button class="word-chip" data-speak="${esc(p)}">${esc(p)} 🔊</button>`).join(" ")}</div>
      ${SR_OK?'':'<div class="notice">🔎 Sans reconnaissance vocale, le chrono d\'1 minute fonctionne quand même. Chrome/Edge affichent en plus ton débit de parole.</div>'}
    </div>`;
  $("#tkNew").onclick=()=>{ if(tkState.running) return; let n; do{ n=TOPICS[Math.floor(Math.random()*TOPICS.length)]; }while(n===tkState.topic && TOPICS.length>1); tkState.topic=n; renderTalk(); };
  $("#tkBtn").onclick=()=>tkState.running?talkStop():talkStart();
}
function talkStart(){
  tkState.running=true; tkState.left=60; tkState.transcript="";
  const btn=$("#tkBtn"); btn.textContent="■ Terminer"; btn.classList.remove("accent"); btn.classList.add("ghost");
  $("#tkResult").innerHTML='<div class="eyebrow" style="margin-top:14px;color:var(--accent)">🔴 Parle maintenant…</div>';
  _run.sess=startContinuousSession({ onUpdate:t=>{ tkState.transcript=t; }, onError:()=>{} });
  _run.timer=setInterval(()=>{
    tkState.left--;
    const c=$("#tkClock"); if(c) c.textContent="00:"+String(Math.max(0,tkState.left)).padStart(2,"0");
    const b=$("#tkBar"); if(b) b.style.width=Math.max(0,tkState.left/60*100)+"%";
    if(tkState.left<=0) talkStop();
  },1000);
}
function talkStop(){
  const elapsed=60-Math.max(0,tkState.left);
  tkState.running=false;
  if(_run.timer){ clearInterval(_run.timer); _run.timer=null; }
  if(_run.sess && _run.sess.stop) _run.sess.stop(); _run.sess=null;
  const btn=$("#tkBtn"); if(btn){ btn.textContent="● Recommencer"; btn.classList.add("accent"); btn.classList.remove("ghost"); }
  const c=$("#tkClock"); if(c) c.textContent="01:00"; const b=$("#tkBar"); if(b) b.style.width="100%";
  addXP(5);
  const words=tkState.transcript.trim()?tkState.transcript.trim().split(/\s+/).length:0;
  const fillers=(tkState.transcript.toLowerCase().match(/\b(um+|uh+|er+|like|you know|kind of|sort of)\b/g)||[]).length;
  const wpm=elapsed>3?Math.round(words/(elapsed/60)):0;
  let msg;
  if(!SR_OK) msg=`Bravo, tu as tenu ${elapsed}s ! Recommence avec un autre sujet pour gagner en aisance.`;
  else if(words<10) msg="Je n'ai pas capté grand-chose — parle plus fort / plus près du micro, ou lance-toi davantage !";
  else if(wpm<90) msg="Bon débit, posé. Essaie d'enchaîner avec moins de pauses la prochaine fois.";
  else if(wpm<150) msg="Très bon débit, naturel et fluide 👏";
  else msg="Débit rapide ! Pense à respirer et articuler pour rester bien clair.";
  const stats = (SR_OK && words>=10)
    ? `<div class="row" style="justify-content:center;gap:24px;margin:12px 0">
        <div><div class="score-ring" style="font-size:1.9rem">${words}</div><div class="eyebrow">mots</div></div>
        <div><div class="score-ring" style="font-size:1.9rem">${wpm}</div><div class="eyebrow">mots/min</div></div>
        <div><div class="score-ring" style="font-size:1.9rem;color:${fillers>4?'var(--gold)':'var(--teal)'}">${fillers}</div><div class="eyebrow">hésitations</div></div></div>`
    : `<div class="score-ring" style="margin:10px 0">${elapsed}s</div>`;
  $("#tkResult").innerHTML=`<div style="margin-top:16px">${stats}<p style="color:var(--ink-soft);max-width:44ch;margin:6px auto">${msg}</p>${(SR_OK&&tkState.transcript)?`<details style="margin-top:8px"><summary style="cursor:pointer;color:var(--ink-soft);font-size:.85rem">Voir ce que tu as dit</summary><p class="heard" style="max-width:52ch;margin:8px auto">${esc(tkState.transcript)}</p></details>`:''}</div>`;
  toast("Bravo ! +5 XP");
}

/* =========================================================================
   PROGRESS — mark days, visualize data, adaptive plan

function readingAvg(){ if(!state.readLog.length) return null; return Math.round(state.readLog.reduce((s,e)=>s+e.pct,0)/state.readLog.length); }
function weekDates(){ const arr=[], t=new Date(); for(let i=6;i>=0;i--){ const d=new Date(t); d.setDate(t.getDate()-i); arr.push(d.toDateString()); } return arr; }
function weeklyStats(){
  const wk=weekDates();
  const daysActive=wk.filter(ds=>state.daysDone[ds]).length;
  const readSec=wk.reduce((s,ds)=>s+(state.readDaily[ds]||0),0);
  const logs=state.readLog.filter(e=>wk.includes(e.date));
  const readAvg=logs.length?Math.round(logs.reduce((s,e)=>s+e.pct,0)/logs.length):null;
  return {daysActive, readSec, readAvg, sessions:logs.length};
}
function weakestSkill(){ return masteryData().reduce((a,b)=>b.val<a.val?b:a); }
function recapMessage(w,weak){
  const bits=[];
  if(w.daysActive>=5) bits.push("Superbe régularité cette semaine 👏.");
  else if(w.daysActive>0) bits.push(`Tu as pratiqué ${w.daysActive} jour(s) — vise 5/7 la semaine prochaine.`);
  else bits.push("Aucune journée marquée cette semaine — reprends en douceur dès aujourd'hui.");
  bits.push(`Ton point faible du moment : <b>${weak.label.toLowerCase()}</b> (${weak.val}%). Consacres-y un peu de temps.`);
  return bits.join(" ");
}
function recapHTML(){
  const w=weeklyStats(), weak=weakestSkill(), sug=suggestLevel();
  const showSug = state.readLog.length>=2 && sug!==state.level;
  return `<div class="card" style="padding:22px;border-top:3px solid var(--accent);margin-bottom:16px">
    <div class="row" style="justify-content:space-between;align-items:center;gap:12px">
      <div><div class="eyebrow">Bilan de la semaine</div><h3 style="font-size:1.2rem;margin-top:3px">Tes 7 derniers jours</h3></div>
      ${levelPickerHTML()}
    </div>
    <div class="stat-row" style="margin-top:16px">
      <div class="stat"><div class="n mono">${w.daysActive}/7</div><div class="l">Jours actifs</div></div>
      <div class="stat"><div class="n mono">${Math.round(w.readSec/60)}</div><div class="l">Min. lues (semaine)</div></div>
      <div class="stat"><div class="n mono">${w.readAvg!=null?w.readAvg+"%":"—"}</div><div class="l">Précision lecture</div></div>
      <div class="stat"><div class="n mono">${weak.val}%</div><div class="l">Point faible : ${weak.label}</div></div>
    </div>
    <div class="notice" style="margin-top:16px">${recapMessage(w,weak)}</div>
    ${showSug?`<div class="row" style="margin-top:12px;justify-content:space-between;align-items:center;gap:10px;background:var(--accent-soft);border:1px solid var(--accent);border-radius:10px;padding:12px 14px">
      <span style="font-size:.88rem">🎚️ D'après tes résultats, le niveau <b>${levelName(sug)} (${sug})</b> te conviendrait mieux.</span>
      <button class="btn accent small" data-lvl="${sug}">Passer en ${sug}</button></div>`:''}
  </div>`;
}
function aggregateMissed(){ const f={}; state.readLog.forEach(e=>(e.missed||[]).forEach(w=>f[w]=(f[w]||0)+1)); return Object.keys(f).sort((a,b)=>f[b]-f[a]); }
function barColor(v){ return v>=80?"var(--teal)":v>=50?"var(--gold)":"var(--accent)"; }
function exportProgress(){
  const data=JSON.stringify(state,null,2);
  const blob=new Blob([data],{type:"application/json"});
  const url=URL.createObjectURL(blob);
  const d=new Date(), stamp=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
  const a=document.createElement("a"); a.href=url; a.download="fluent-lab-"+stamp+".json";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1500);
  toast("Progression exportée ⬇︎");
}
function importProgress(file){
  const r=new FileReader();
  r.onload=()=>{
    try{
      const s=JSON.parse(r.result);
      state=Object.assign({},DEFAULT_STATE,s);
      state.gen=Object.assign({done:0,skill:{},history:[]},state.gen||{});
      state.gen.skill=Object.assign({},state.gen.skill);
      state.gen.history=(state.gen.history||[]).slice();
      state.streak=computeStreak(); save(); updateStreakBadge();
      toast("Progression importée ✓"); go("progress");
    }catch(e){ toast("Fichier invalide"); }
  };
  r.readAsText(file);
}
function masteryData(){
  const total=allWords().length, known=Object.keys(state.known).length;
  return [
    {label:"Vocabulaire", val:total?Math.round(known/total*100):0},
    {label:"Grammaire",   val:(function(){ const gl=levelSkills(); return gl.length?Math.round(gl.reduce((s,gb)=>s+(state.lessonsDone[gb.key]||0),0)/gl.length):0; })()},
    {label:"Lecture",     val:readingAvg()||0},
    {label:"Prononciation", val:state.speakBest||0}
  ];
}
function calendarHTML(){
  const days=35, today=new Date();
  const start=new Date(today); start.setDate(today.getDate()-(days-1));
  const lead=(start.getDay()+6)%7; // 0 = Monday
  let html='<div class="cal">'+["L","M","M","J","V","S","D"].map(d=>`<div class="dow">${d}</div>`).join("");
  for(let i=0;i<lead;i++) html+='<div class="cell empty"></div>';
  for(let i=0;i<days;i++){
    const d=new Date(start); d.setDate(start.getDate()+i); const ds=d.toDateString();
    const isToday=ds===today.toDateString(), done=!!state.daysDone[ds], future=d>today && !isToday;
    html+=`<div class="cell ${done?"done":""} ${isToday?"today":""} ${future?"future":""}" data-day="${ds}" title="${ds}">${d.getDate()}</div>`;
  }
  return html+"</div>";
}
function readingBarsHTML(){
  const days=14, today=new Date(), arr=[]; let maxSec=600;
  for(let i=days-1;i>=0;i--){ const d=new Date(today); d.setDate(today.getDate()-i); const ds=d.toDateString(); const sec=state.readDaily[ds]||0; maxSec=Math.max(maxSec,sec); arr.push({d,sec,ds}); }
  return `<div class="barc">${arr.map(o=>{ const h=Math.round(o.sec/maxSec*100); const lbl=["D","L","M","M","J","V","S"][o.d.getDay()];
    return `<div class="bar ${o.sec>=600?"goal":""}" title="${o.ds} : ${fmt(o.sec)}"><i style="height:${h}%"></i><small>${lbl}</small></div>`; }).join("")}</div>`;
}
function buildRecs(){
  const recs=[];
  const todaySec=state.readDaily[todayKey()]||0;
  if(todaySec<600) recs.push({ico:"▥",title:"Termine tes 10 minutes de lecture",desc:`Il te reste ${fmt(600-todaySec)} aujourd'hui.`,btn:"Lire",go:"reading"});
  const weak=levelSkills().filter(gb=>(state.lessonsDone[gb.key]||0)<80);
  if(weak.length){ const g=weak[0]; recs.push({ico:"▦",title:`Grammaire à consolider : ${g.title}`,desc:state.lessonsDone[g.key]!=null?`Ton score : ${state.lessonsDone[g.key]}%. Vise 80%+ pour la valider.`:"Tu n'as pas encore fait cette leçon.",lesson:g.key}); }
  const mw=aggregateMissed();
  if(mw.length) recs.push({ico:"●",title:"Mots à reprononcer",desc:"Ils reviennent souvent dans ton carnet d'erreurs — clique pour les réécouter.",words:mw.slice(0,8)});
  const known=Object.keys(state.known).length, total=allWords().length;
  if(total && known/total<0.5) recs.push({ico:"▤",title:"Enrichis ton vocabulaire",desc:`Tu as appris ${known}/${total} mots. Continue les cartes-mémo.`,btn:"Réviser",go:"vocab"});
  const ravg=readingAvg();
  if(ravg!=null){
    if(ravg>=90) recs.push({ico:"▲",title:"Monte en niveau",desc:`Ta lecture est excellente (${ravg}%). Essaie un texte plus difficile (B2).`,btn:"Lire",go:"reading"});

  if(!state.daysDone[todayKey()]) recs.push({ico:"✓",title:"Marque ta journée",desc:"Fais au moins un exercice aujourd'hui pour garder ta série.",btn:"Commencer",go:"reading"});
  if(!recs.length) recs.push({ico:"🎉",title:"Tout est à jour !",desc:"Beau travail. Continue sur ta lancée, tu es sur la bonne voie."});
  return recs;
}
