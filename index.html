    </div>`;
  $("#expBtn").onclick=exportProgress;
  $("#impBtn").onclick=()=>$("#impFile").click();
  $("#impFile").onchange=e=>{ if(e.target.files[0]) importProgress(e.target.files[0]); };
  $("#markToday").onclick=()=>{ markDay(todayKey(), !state.daysDone[todayKey()]); updateStreakBadge(); renderProgress(); };
  v.querySelectorAll(".cell[data-day]").forEach(c=>{ if(c.classList.contains("future")||c.classList.contains("empty")) return;
    c.onclick=()=>{ const ds=c.dataset.day; markDay(ds, !state.daysDone[ds]); updateStreakBadge(); renderProgress(); }; });
  v.querySelectorAll("[data-plango]").forEach(b=>b.onclick=()=>go(b.dataset.plango));
  v.querySelectorAll("[data-planlesson]").forEach(b=>b.onclick=()=>goLesson(b.dataset.planlesson));
}

/* =========================================================================
   PARCOURS — generated adaptive lessons
   ========================================================================= */
function levelRank(l){ return l==="A2"?0:l==="B1"?1:2; }
function candidateSkills(){ return GRAMMAR_BANK.filter(gb=>levelRank(gb.level)<=levelRank(state.level)); }
function levelSkills(){ return GRAMMAR_BANK.filter(gb=>gb.level===state.level); }
function skillMastery(k){ return (state.gen.skill&&state.gen.skill[k])||0; }
function pickFocus(){
  const c=levelSkills();
  const min=Math.min(...c.map(gb=>skillMastery(gb.key)));
  const weak=c.filter(gb=>skillMastery(gb.key)===min);
  return weak[Math.floor(Math.random()*weak.length)];
}
function mcqFrom(it,skill){ return {type:"mcq", prompt:it.q, options:it.opts, answer:it.a, why:it.why, skill}; }
function vocabItem(){
  const pool=allWords().filter(w=>w.lvl===state.level); const P=pool.length?pool:allWords();
  const w=P[Math.floor(Math.random()*P.length)];
  const others=shuffle(allWords().filter(x=>x.en!==w.en)).slice(0,3);
  const opts=shuffle([w,...others]);
  return {type:"mcq", prompt:`Traduis en anglais : « ${w.fr} »`, options:opts.map(o=>o.en), answer:opts.findIndex(o=>o.en===w.en), why:`« ${w.fr} » = « ${w.en} ».`, skill:"vocab", speak:w.en};
}
function orderItem(){ const s=SENTENCES[Math.floor(Math.random()*SENTENCES.length)]; return {type:"order", sentence:s, skill:"wordorder"}; }
function genLesson(){
  const focus=pickFocus();
  const n=Math.max(5,Math.min(9,5+Math.floor(state.gen.done/3)));
  const tasks=[];
  shuffle(focus.items).slice(0,3).forEach(it=>tasks.push(mcqFrom(it,focus.key)));
  shuffle(candidateSkills().filter(gb=>gb.key!==focus.key)).slice(0,2).forEach(gb=>{ const it=gb.items[Math.floor(Math.random()*gb.items.length)]; tasks.push(mcqFrom(it,gb.key)); });
  tasks.push(vocabItem());
  if(n>=7) tasks.push(vocabItem());
  tasks.push(orderItem());
  while(tasks.length<n){ const it=focus.items[Math.floor(Math.random()*focus.items.length)]; tasks.push(mcqFrom(it,focus.key)); }
  return {title:`Leçon ${state.gen.done+1} · ${state.level} — focus : ${focus.title}`, focus, tasks:shuffle(tasks).slice(0,n)};
}
let pathLesson=null;
function renderPath(){
  const v=$("#view-path");
  const c=levelSkills();
  const masteredCount=c.filter(gb=>skillMastery(gb.key)>=80).length;
  const allMastered=c.length && masteredCount===c.length;
  const focus=pickFocus();
  const fi=c.findIndex(gb=>gb.key===focus.key)+1;
  const nEx=Math.max(5,Math.min(9,5+Math.floor(state.gen.done/3)));
  const hist=state.gen.history||[];
  v.innerHTML=`
    <div class="section-head"><div><h2>Parcours</h2><p>Des leçons générées et personnalisées, qui évoluent avec ta progression.</p></div>${levelPickerHTML()}</div>
    <div class="stat-row" style="margin-bottom:16px">
      <div class="stat"><div class="n mono">${state.gen.done}</div><div class="l">Leçons générées</div></div>
      <div class="stat"><div class="n mono">${masteredCount}/${c.length}</div><div class="l">Points maîtrisés (${state.level})</div></div>
      <div class="stat"><div class="n mono">${state.xp}</div><div class="l">Points XP</div></div>
    </div>
    ${allMastered && levelRank(state.level)<2 ? `<div class="card" style="padding:16px 18px;margin-bottom:16px;background:var(--accent-soft);border:1px solid var(--accent)"><b>🏆 Tu maîtrises tout le niveau ${state.level} !</b> <span style="color:var(--ink-soft)">Passe au niveau supérieur pour débloquer de nouvelles leçons.</span> <button class="btn accent small" data-lvl="${state.level==="A2"?"B1":"B2"}" style="margin-left:6px">Passer en ${state.level==="A2"?"B1":"B2"}</button></div>`:""}
    <div class="card" style="padding:26px;text-align:center">
      <div class="eyebrow">Ta prochaine leçon · niveau ${state.level} · Leçon ${String(fi).padStart(2,"0")}/${c.length}</div>
      <h3 style="font-size:1.35rem;margin:8px 0 6px;letter-spacing:-.01em">Focus : ${focus.title}</h3>
      <p style="color:var(--ink-soft);max-width:48ch;margin:0 auto 6px">${focus.rule}</p>
      <p style="font-size:.8rem;color:var(--ink-soft)">Générée d'après ton niveau et tes points faibles · ${nEx} exercices</p>
      <button class="btn accent" id="genBtn" style="margin-top:16px">▶︎ Générer ma leçon</button>
    </div>
    <div class="card" style="padding:22px;margin-top:16px">
      <div class="eyebrow">Ta carte de progression — niveau ${state.level} · ${c.length} leçons</div>
      <div class="mbar" style="margin-top:14px">${c.map((gb,i)=>{ const m=skillMastery(gb.key); return `<div class="r"><span style="font-size:.82rem"><span class="mono" style="color:var(--accent);font-size:.72rem;margin-right:5px">${String(i+1).padStart(2,"0")}</span>${gb.title}</span><div class="track"><i style="width:${m}%;background:${barColor(m)}"></i></div><span class="pctv" style="color:${barColor(m)}">${m}%</span></div>`; }).join("")}</div>
    </div>
    ${hist.length?`<div class="section-head" style="margin:28px 0 14px"><div><h2 style="font-size:1.2rem">Leçons terminées</h2></div></div>
      <div class="grid">${hist.map(h=>`<div class="card" style="padding:14px 16px"><div class="row" style="justify-content:space-between"><b style="font-size:.9rem">${esc(h.title)}</b><span class="mono" style="color:${barColor(h.pct)};font-weight:700">${h.pct}%</span></div><div style="color:var(--ink-soft);font-size:.76rem;margin-top:2px">${esc(h.date)}</div></div>`).join("")}</div>`:""}
  `;
  $("#genBtn").onclick=()=>{ pathLesson=genLesson(); runLesson(); window.scrollTo({top:0,behavior:"smooth"}); };
}
function runLesson(){
  const v=$("#view-path"), L=pathLesson;
  let correct=0, answered=0, focusCorrect=0;
  const focusTotal=L.tasks.filter(t=>t.skill===L.focus.key).length;
  v.innerHTML=`<button class="btn ghost small" id="backP">← Parcours</button>
    <div class="card lesson-detail" style="margin-top:14px">
      <div class="eyebrow">Leçon générée · niveau ${state.level}</div>
      <h2 style="font-size:1.4rem">${esc(L.title)}</h2>
      <div class="notice" style="margin-top:10px"><b>${esc(L.focus.title)}</b> — ${L.focus.rule}</div>
      <div id="taskBox"></div>
      <div id="lessonEnd"></div>
    </div>`;
  $("#backP").onclick=renderPath;
  const box=$("#taskBox");
  function checkEnd(){
    if(answered<L.tasks.length) return;
    const pct=Math.round(correct/L.tasks.length*100);
    const perf=focusTotal?Math.round(focusCorrect/focusTotal*100):pct;
    state.gen.skill[L.focus.key]=Math.round(skillMastery(L.focus.key)*0.5 + perf*0.5);
    state.gen.done++;
    state.gen.history=(state.gen.history||[]); state.gen.history.unshift({title:L.title, pct, date:new Date().toDateString()}); state.gen.history=state.gen.history.slice(0,10);
    addXP(correct*3); save();
    $("#lessonEnd").innerHTML=`<div style="text-align:center;margin-top:20px;border-top:1px solid var(--line);padding-top:18px">
      <span class="score-ring" style="color:${barColor(pct)}">${pct}%</span>
      <div class="eyebrow">${correct}/${L.tasks.length} · +${correct*3} XP</div>
      <p style="color:var(--ink-soft)">${pct>=80?"Excellent ! Ce point est en bonne voie 💪":pct>=50?"Bien joué, tu progresses.":"Ça vient — refais une leçon pour l'ancrer."}</p>
      <div class="row" style="justify-content:center">
        <button class="btn accent" id="nextLesson">Leçon suivante →</button>
        <button class="btn ghost" id="toPath">Voir mon parcours</button>
      </div></div>`;
    $("#nextLesson").onclick=()=>{ pathLesson=genLesson(); runLesson(); window.scrollTo({top:0,behavior:"smooth"}); };
    $("#toPath").onclick=renderPath;
  }
  L.tasks.forEach((t,ti)=>{
    const wrap=el("div","quiz-q");
    if(t.type==="mcq"){
      wrap.innerHTML=`<div class="q">${ti+1}. ${esc(t.prompt)} ${t.speak?spk(t.speak):""}</div>`;
      const fb=el("div","feedback");
      t.options.forEach((opt,oi)=>{
        const b=el("button","opt",esc(opt));
        b.onclick=()=>{
          if(wrap.dataset.done)return; wrap.dataset.done="1"; answered++;
          wrap.querySelectorAll(".opt").forEach(x=>x.disabled=true);
          if(oi===t.answer){ b.classList.add("correct"); correct++; if(t.skill===L.focus.key)focusCorrect++; fb.className="feedback show ok"; fb.textContent="✓ "+(t.why||"Correct !"); }
          else { b.classList.add("wrong"); wrap.querySelectorAll(".opt")[t.answer].classList.add("correct"); fb.className="feedback show no"; fb.textContent="✗ "+(t.why||("Réponse : "+t.options[t.answer])); }
          checkEnd();
        };
        wrap.appendChild(b);
      });
      wrap.appendChild(fb);
    } else if(t.type==="order"){
      wrap.innerHTML=`<div class="q">${ti+1}. Remets la phrase dans l'ordre ${spk(t.sentence)}</div>`;
      const words=t.sentence.split(" "); let placed=[];
      const target=el("div","builder-target"), bank=el("div","bank"), fb=el("div","feedback");
      function draw(){
        bank.innerHTML=""; target.innerHTML="";
        shuffle(words.map((w,i)=>({w,i}))).forEach(o=>{ if(placed.includes(o.i))return; const cc=el("button","word-chip",esc(o.w)); cc.onclick=()=>{ if(wrap.dataset.done)return; placed.push(o.i); draw(); }; bank.appendChild(cc); });
        placed.forEach((idx,pos)=>{ const cc=el("button","word-chip",esc(words[idx])); cc.onclick=()=>{ if(wrap.dataset.done)return; placed.splice(pos,1); draw(); }; target.appendChild(cc); });
        if(!placed.length) target.innerHTML='<span style="color:var(--ink-soft);font-size:.85rem">Clique les mots pour construire la phrase…</span>';
      }
      const chk=el("button","btn accent small","Vérifier"); chk.style.marginTop="10px";
      chk.onclick=()=>{ if(wrap.dataset.done)return; wrap.dataset.done="1"; answered++;
        const attempt=placed.map(i=>words[i]).join(" ");
        if(attempt===t.sentence){ correct++; fb.className="feedback show ok"; fb.textContent="✓ Parfait ! « "+t.sentence+". »"; speak(t.sentence); }
        else { fb.className="feedback show no"; fb.textContent="✗ Ordre correct : « "+t.sentence+". »"; }
        checkEnd();
      };
      wrap.appendChild(target); wrap.appendChild(bank); wrap.appendChild(chk); wrap.appendChild(fb);
      draw();
    }
    box.appendChild(wrap);
  });
}

$("#streakN").textContent=state.streak;

state.sessions=(state.sessions||0)+1; save();
setInterval(()=>{ if(document.visibilityState==="visible"){ state.appDaily[todayKey()]=(state.appDaily[todayKey()]||0)+5; save(); } }, 5000);

document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="hidden") syncStatsBeacon(); });

syncStats();
